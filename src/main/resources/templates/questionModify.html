<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Редактирование вопроса</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<h1>Редактирование вопроса</h1>

<div class="card mb-3">
    <div class="card-header">Редактирование вопроса</div>
    <div class="card-body">
        <form th:action="@{/questions/save}" method="post">
            <div class="mb-3">
                <input type="hidden" class="form-control" name="id" th:value="${question.id}">
            </div>
            <div class="mb-3">
                <label for="levelId" class="form-label">Уровень</label>
                <select class="form-control" name="levelId" id="levelId" required>
                    <option th:each="level : ${levels}" th:value="${level.id}" th:text="${level.name}" th:selected="${level.id == question.levelId}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="topicId" class="form-label">Тема</label>
                <select class="form-control" name="topicId" id="topicId" required>
                    <option th:each="topic : ${topics}" th:value="${topic.id}" th:text="${topic.topic}" th:selected="${topic.id == question.topicId}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="question" class="form-label">Вопрос</label>
                <input type="text" class="form-control" name="question" id="question" th:value="${question.question}" required maxlength="200">
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>

            <a href="/questions" class=”btn btn-sm btn-danger”>Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
