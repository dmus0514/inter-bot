<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Редактирование уровня</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<h1>Редактирование уровня</h1>

<div class="card mb-3">
    <div class="card-header">Редактирование уровня</div>
    <div class="card-body">
        <form th:action="@{/levels/save}" method="post">
            <div class="mb-3">
                 <input type="hidden" class="form-control" name="id" th:value="${level.id}">
            </div>
            <div class="mb-3">
                <label for="levelName" class="form-label">Имя</label>
                <input type="text" class="form-control" name="name" id="levelName" th:value="${level.name}" required maxlength="50">
            </div>
            <div class="mb-3">
                <label for="levelDescr" class="form-label">Описание</label>
                <input type="text" class="form-control" name="description" id="levelDescr" th:value="${level.description}" required maxlength="200">
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>

            <a href="/questions" class=”btn btn-sm btn-danger”>Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
