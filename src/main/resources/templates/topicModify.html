<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Редактирование темы</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<h1>Редактирование темы</h1>

<div class="card mb-3">
    <div class="card-header">Редактирование темы</div>
    <div class="card-body">
        <form th:action="@{/topics/save}" method="post">
            <div class="mb-3">
                 <input type="hidden" class="form-control" name="id" th:value="${topic.id}">
            </div>
            <div class="mb-3">
                <label for="topic" class="form-label">Тема</label>
                <input type="text" class="form-control" name="topic" id="topic" th:value="${topic.topic}" required maxlength="50">
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>

            <a href="/questions" class=”btn btn-sm btn-danger”>Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
